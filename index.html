<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Racing 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
    <script>
        // Simple 3D Racing Game
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, -20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Lights
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(50, 100, 50);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        // Track
        const trackGeometry = new THREE.PlaneGeometry(15, 300);
        const trackMaterial = new THREE.MeshLambertMaterial({ color: 0x2a2a4a });
        const track = new THREE.Mesh(trackGeometry, trackMaterial);
        track.rotation.x = Math.PI / 2;
        scene.add(track);

        // Car
        const carGeometry = new THREE.BoxGeometry(3, 1.6, 8);
        const carMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
        const car = new THREE.Mesh(carGeometry, carMaterial);
        car.position.set(0, 2, 0);
        scene.add(car);

        // Physics
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);

        const carBody = new CANNON.Body({ mass: 1500 });
        carBody.addShape(new CANNON.Box(new CANNON.Vec3(1.5, 0.8, 4)));
        carBody.position.set(0, 2, 0);
        world.addBody(carBody);

        // Input
        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Controls
            if (keys['arrowup'] || keys['w']) carBody.velocity.z = Math.max(carBody.velocity.z - 2, -50);
            if (keys['arrowdown'] || keys['s']) carBody.velocity.z *= 0.9;
            if (keys['arrowleft'] || keys['a']) carBody.angularVelocity.y += 0.1;
            if (keys['arrowright'] || keys['d']) carBody.angularVelocity.y -= 0.1;

            // Physics step
            world.step(1 / 60);

            // Update car position
            car.position.copy(carBody.position);
            car.quaternion.copy(carBody.quaternion);

            // Camera follow
            camera.position.lerp(new THREE.Vector3(car.position.x, car.position.y + 8, car.position.z - 20), 0.1);
            camera.lookAt(car.position);

            renderer.render(scene, camera);
        }

        animate();

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
