<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Racing Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #hud { position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace; font-size: 16px; }
    </style>
</head>
<body>
    <div id="hud">
        <div>Speed: <span id="speed">0</span> km/h</div>
        <div>Use Arrow Keys to Drive</div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 400, 1000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 5, -15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(100, 100, 100);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // Ground/Track
        const trackGeom = new THREE.PlaneGeometry(20, 500);
        const trackMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const track = new THREE.Mesh(trackGeom, trackMat);
        track.rotation.x = -Math.PI / 2;
        track.receiveShadow = true;
        scene.add(track);

        // Road markings
        const lineGeom = new THREE.BufferGeometry();
        const positions = [];
        for (let i = 0; i < 50; i++) {
            positions.push(-0.5, 0.01, -i * 10);
            positions.push(0.5, 0.01, -i * 10);
        }
        lineGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 2 });
        const lines = new THREE.LineSegments(lineGeom, lineMat);
        scene.add(lines);

        // Car
        const carGroup = new THREE.Group();
        const bodyGeom = new THREE.BoxGeometry(2, 1.2, 4);
        const bodyMat = new THREE.MeshPhongMaterial({ color: 0xff0000 });
        const body = new THREE.Mesh(bodyGeom, bodyMat);
        body.castShadow = true;
        body.receiveShadow = true;
        carGroup.add(body);

        // Wheels
        const wheelGeom = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
        const wheelMat = new THREE.MeshPhongMaterial({ color: 0x000000 });
        const wheelPositions = [[-0.8, -0.6, 0.8], [0.8, -0.6, 0.8], [-0.8, -0.6, -0.8], [0.8, -0.6, -0.8]];
        
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeom, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            wheel.castShadow = true;
            carGroup.add(wheel);
        });

        carGroup.position.y = 1;
        scene.add(carGroup);

        // Game state
        const keys = {};
        let carSpeed = 0;
        let carRotation = 0;

        document.addEventListener('keydown', (e) => keys[e.key] = true);
        document.addEventListener('keyup', (e) => keys[e.key] = false);

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Controls
            if (keys['ArrowUp'] || keys['w']) carSpeed = Math.min(carSpeed + 0.5, 30);
            if (keys['ArrowDown'] || keys['s']) carSpeed = Math.max(carSpeed - 0.5, -10);
            if (keys['ArrowLeft'] || keys['a']) carRotation += 0.05;
            if (keys['ArrowRight'] || keys['d']) carRotation -= 0.05;

            carSpeed *= 0.95; // friction

            // Move car
            carGroup.position.z += Math.cos(carRotation) * carSpeed;
            carGroup.position.x += Math.sin(carRotation) * carSpeed;
            carGroup.rotation.y = carRotation;

            // Keep car on track
            if (Math.abs(carGroup.position.x) > 10) carGroup.position.x = Math.sign(carGroup.position.x) * 10;
            if (carGroup.position.z > 100) carGroup.position.z = -250;

            // Camera follow
            const camX = carGroup.position.x - Math.sin(carRotation) * 8;
            const camZ = carGroup.position.z - Math.cos(carRotation) * 8;
            camera.position.lerp(new THREE.Vector3(camX, 6, camZ), 0.1);
            camera.lookAt(carGroup.position.x, 1, carGroup.position.z);

            // Update HUD
            document.getElementById('speed').textContent = Math.abs(Math.floor(carSpeed * 10));

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
