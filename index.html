<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Racing Game</title>
    <style>
        body { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; background: #000; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #hud { position: absolute; top: 20px; left: 20px; color: #0f0; font-family: monospace; font-size: 20px; text-shadow: 0 0 10px #0f0; pointer-events: none; }
        #controls { position: absolute; bottom: 30px; right: 30px; width: 180px; height: 180px; pointer-events: auto; }
        .btn { position: absolute; width: 60px; height: 60px; background: rgba(0, 255, 0, 0.5); border: 3px solid #0f0; color: #0f0; font-size: 32px; font-weight: bold; border-radius: 10px; cursor: pointer; user-select: none; pointer-events: auto; }
        .btn:active { background: rgba(0, 255, 0, 0.9); box-shadow: 0 0 20px #0f0; }
        #btnLeft { bottom: 60px; left: 0; }
        #btnRight { bottom: 60px; right: 0; }
        #btnAccel { top: 0; left: 50%; transform: translateX(-50%); }
        #btnBrake { top: 70px; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="hud">
            <div>Speed: <span id="speed">0</span></div>
            <div>Lap: <span id="lap">00:00</span></div>
        </div>
        <div id="controls">
            <button class="btn" id="btnLeft">←</button>
            <button class="btn" id="btnRight">→</button>
            <button class="btn" id="btnAccel">▲</button>
            <button class="btn" id="btnBrake">▼</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        console.log("Game Starting...");
        
        const canvas = document.getElementById('gameCanvas');
        
        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        
        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, -20);
        camera.lookAt(0, 0, 0);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x87CEEB);
        console.log("Renderer created");
        
        // Lights
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(50, 100, 50);
        scene.add(light);
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        console.log("Lights added");
        
        // Ground
        const groundGeometry = new THREE.PlaneGeometry(20, 500);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);
        console.log("Ground added");
        
        // Car
        const carGeometry = new THREE.BoxGeometry(2, 1.2, 4);
        const carMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
        const car = new THREE.Mesh(carGeometry, carMaterial);
        car.position.y = 1;
        scene.add(car);
        console.log("Car added");
        
        // Game variables
        let speed = 0;
        let rotation = 0;
        let keys = {};
        let lapTime = 0;
        let lapStart = Date.now();
        
        // Input
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Touch buttons
        document.getElementById('btnLeft').addEventListener('touchstart', () => { keys['left'] = true; });
        document.getElementById('btnLeft').addEventListener('touchend', () => { keys['left'] = false; });
        document.getElementById('btnRight').addEventListener('touchstart', () => { keys['right'] = true; });
        document.getElementById('btnRight').addEventListener('touchend', () => { keys['right'] = false; });
        document.getElementById('btnAccel').addEventListener('touchstart', () => { keys['accel'] = true; });
        document.getElementById('btnAccel').addEventListener('touchend', () => { keys['accel'] = false; });
        document.getElementById('btnBrake').addEventListener('touchstart', () => { keys['brake'] = true; });
        document.getElementById('btnBrake').addEventListener('touchend', () => { keys['brake'] = false; });
        
        // Mouse buttons
        document.getElementById('btnLeft').addEventListener('mousedown', () => { keys['left'] = true; });
        document.getElementById('btnLeft').addEventListener('mouseup', () => { keys['left'] = false; });
        document.getElementById('btnRight').addEventListener('mousedown', () => { keys['right'] = true; });
        document.getElementById('btnRight').addEventListener('mouseup', () => { keys['right'] = false; });
        document.getElementById('btnAccel').addEventListener('mousedown', () => { keys['accel'] = true; });
        document.getElementById('btnAccel').addEventListener('mouseup', () => { keys['accel'] = false; });
        document.getElementById('btnBrake').addEventListener('mousedown', () => { keys['brake'] = true; });
        document.getElementById('btnBrake').addEventListener('mouseup', () => { keys['brake'] = false; });
        
        // Game loop
        function gameLoop() {
            requestAnimationFrame(gameLoop);
            
            // Controls
            if (keys['ArrowUp'] || keys['w'] || keys['accel']) speed = Math.min(speed + 0.3, 25);
            if (keys['ArrowDown'] || keys['s'] || keys['brake']) speed = Math.max(speed - 0.5, -5);
            if (keys['ArrowLeft'] || keys['a'] || keys['left']) rotation += 0.08;
            if (keys['ArrowRight'] || keys['d'] || keys['right']) rotation -= 0.08;
            
            speed *= 0.93; // Friction
            
            // Move car
            car.position.z += Math.cos(rotation) * speed;
            car.position.x += Math.sin(rotation) * speed;
            car.rotation.y = rotation;
            
            // Lap detection
            if (car.position.z > 100) {
                car.position.z = -250;
                lapStart = Date.now();
            }
            
            // Keep on track
            if (car.position.x > 10) car.position.x = 10;
            if (car.position.x < -10) car.position.x = -10;
            
            // Camera follow
            const camX = car.position.x - Math.sin(rotation) * 10;
            const camZ = car.position.z - Math.cos(rotation) * 10;
            camera.position.lerp(new THREE.Vector3(camX, 8, camZ), 0.1);
            camera.lookAt(car.position.x, 1, car.position.z);
            
            // Update HUD
            document.getElementById('speed').textContent = Math.max(0, Math.floor(speed * 5));
            lapTime = Math.floor((Date.now() - lapStart) / 1000);
            const mins = Math.floor(lapTime / 60);
            const secs = lapTime % 60;
            document.getElementById('lap').textContent = 
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            
            // Render
            renderer.render(scene, camera);
        }
        
        console.log("Starting game loop...");
        gameLoop();
        
        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
