<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Racing Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { display: block; }
        #hud { position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace; font-size: 16px; z-index: 10; }
        #controls { position: absolute; bottom: 20px; right: 20px; width: 150px; height: 150px; z-index: 10; }
        .btn { position: absolute; width: 50px; height: 50px; background: rgba(0,255,0,0.3); border: 2px solid #0f0; color: #0f0; font-size: 24px; font-weight: bold; border-radius: 8px; cursor: pointer; touch-action: manipulation; }
        #btnLeft { bottom: 50px; left: 0; }
        #btnRight { bottom: 50px; right: 0; }
        #btnAccel { top: 0; left: 50%; transform: translateX(-50%); }
        #btnBrake { top: 60px; left: 50%; transform: translateX(-50%); }
        .btn:active { background: rgba(0,255,0,0.8); box-shadow: 0 0 10px rgba(0,255,0,0.8); }
    </style>
</head>
<body>
    <div id="hud">
        <div>Speed: <span id="speed">0</span> km/h</div>
        <div>Lap: <span id="lap">0:00</span></div>
    </div>
    <div id="controls">
        <button class="btn" id="btnLeft">←</button>
        <button class="btn" id="btnRight">→</button>
        <button class="btn" id="btnAccel">▲</button>
        <button class="btn" id="btnBrake">▼</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 400, 1000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 5, -15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(100, 100, 100);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // Ground/Track
        const trackGeom = new THREE.PlaneGeometry(20, 500);
        const trackMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const track = new THREE.Mesh(trackGeom, trackMat);
        track.rotation.x = -Math.PI / 2;
        track.receiveShadow = true;
        scene.add(track);

        // Road markings
        const lineGeom = new THREE.BufferGeometry();
        const positions = [];
        for (let i = 0; i < 50; i++) {
            positions.push(-0.5, 0.01, -i * 10);
            positions.push(0.5, 0.01, -i * 10);
        }
        lineGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 2 });
        const lines = new THREE.LineSegments(lineGeom, lineMat);
        scene.add(lines);

        // Car
        const carGroup = new THREE.Group();
        const bodyGeom = new THREE.BoxGeometry(2, 1.2, 4);
        const bodyMat = new THREE.MeshPhongMaterial({ color: 0xff0000 });
        const body = new THREE.Mesh(bodyGeom, bodyMat);
        body.castShadow = true;
        body.receiveShadow = true;
        carGroup.add(body);

        // Wheels
        const wheelGeom = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
        const wheelMat = new THREE.MeshPhongMaterial({ color: 0x000000 });
        const wheelPositions = [[-0.8, -0.6, 0.8], [0.8, -0.6, 0.8], [-0.8, -0.6, -0.8], [0.8, -0.6, -0.8]];
        
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeom, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            wheel.castShadow = true;
            carGroup.add(wheel);
        });

        carGroup.position.y = 1;
        scene.add(carGroup);

        // Game state
        const keys = {};
        let carSpeed = 0;
        let carRotation = 0;
        let lapStart = Date.now();

        // Touch controls
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnAccel = document.getElementById('btnAccel');
        const btnBrake = document.getElementById('btnBrake');

        const touchStart = (id) => (e) => { e.preventDefault(); keys[id] = true; };
        const touchEnd = (id) => (e) => { e.preventDefault(); keys[id] = false; };

        btnLeft.addEventListener('touchstart', touchStart('left'));
        btnLeft.addEventListener('touchend', touchEnd('left'));
        btnRight.addEventListener('touchstart', touchStart('right'));
        btnRight.addEventListener('touchend', touchEnd('right'));
        btnAccel.addEventListener('touchstart', touchStart('accel'));
        btnAccel.addEventListener('touchend', touchEnd('accel'));
        btnBrake.addEventListener('touchstart', touchStart('brake'));
        btnBrake.addEventListener('touchend', touchEnd('brake'));

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys['accel'] = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys['brake'] = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys['left'] = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys['right'] = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys['accel'] = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys['brake'] = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys['left'] = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys['right'] = false;
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Controls
            if (keys['accel']) carSpeed = Math.min(carSpeed + 0.5, 30);
            if (keys['brake']) carSpeed = Math.max(carSpeed - 0.5, -10);
            if (keys['left']) carRotation += 0.05;
            if (keys['right']) carRotation -= 0.05;

            carSpeed *= 0.95; // friction

            // Move car
            carGroup.position.z += Math.cos(carRotation) * carSpeed;
            carGroup.position.x += Math.sin(carRotation) * carSpeed;
            carGroup.rotation.y = carRotation;

            // Keep car on track
            if (Math.abs(carGroup.position.x) > 10) carGroup.position.x = Math.sign(carGroup.position.x) * 10;
            if (carGroup.position.z > 100) {
                carGroup.position.z = -250;
                lapStart = Date.now();
            }

            // Camera follow
            const camX = carGroup.position.x - Math.sin(carRotation) * 8;
            const camZ = carGroup.position.z - Math.cos(carRotation) * 8;
            camera.position.lerp(new THREE.Vector3(camX, 6, camZ), 0.1);
            camera.lookAt(carGroup.position.x, 1, carGroup.position.z);

            // Update HUD
            document.getElementById('speed').textContent = Math.abs(Math.floor(carSpeed * 10));
            
            const elapsed = Math.floor((Date.now() - lapStart) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            document.getElementById('lap').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
